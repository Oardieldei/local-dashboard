<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Local dashboard</title>
	<link rel="shortcut icon" href="./img/favicon.png" type="image/x-icon">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="./css/clean.css">
	<link rel="stylesheet" href="./css/full.css">
	<link rel="stylesheet" href="./css/sidebar.css">
	<link rel="stylesheet" href="./css/main-full.css">
</head>

<body class="body">
	<div class="full_wrapper">
		<aside class="sidebar">
			<header class="header">
				<a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="logo" target="_blank">
					<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff"
						stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
						<rect width="20" height="14" x="2" y="6" rx="2"></rect>
					</svg>
				</a>
				<h1 class="h1">Dashboard</h1>
			</header>
			<nav class="nav">
				<ul class="nav_ul">
					<li class="nav__item active">
						<div class="nav__item_icon">
							<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
								stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
								<circle cx="9" cy="7" r="4"></circle>
								<path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
								<path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
							</svg>
						</div>
						<div class="nav__item_text" data-i18n="employees"></div>
					</li>
					<li class="nav__item">
						<div class="nav__item_icon">
							<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
								sstroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
								<rect width="20" height="14" x="2" y="6" rx="2"></rect>
							</svg>
						</div>
						<div class="nav__item_text" data-i18n="projects"></div>
					</li>
					<li class="nav__item">
						<div class="nav__item_icon">
							<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
								stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<path
									d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z">
								</path>
								<path d="M8 10v4"></path>
								<path d="M12 10v2"></path>
								<path d="M16 10v6"></path>
							</svg>
						</div>
						<div class="nav__item_text" data-i18n="assignments"></div>
					</li>
				</ul>
			</nav>
			<footer class="footer">
				<div class="lang-changer__wrapper">
					<div class="lang-changer__icon">
						<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
							stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<circle cx="12" cy="12" r="10"></circle>
							<path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
							<path d="M2 12h20"></path>
						</svg>
					</div>
					<span class="lang-changer__text" data-i18n="langtext"></span>
					<span class="lang-changer__lang" data-i18n="lang"></span>
				</div>
			</footer>
		</aside>
		<main class="main">
			<div class="main__header grey-block">
				<div class="main__header__sidebar_arrow">
					<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
						stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<rect width="18" height="18" x="3" y="3" rx="2"></rect>
						<path d="M9 3v18"></path>
						<path d="m16 15-3-3 3-3"></path>
					</svg>
				</div>
				<div class="main__header__separator"></div>
				<div class="main__header__date_chooser">
					<select id="month" name="month" class="main__header__date_chooser__input main__header__date_chooser__month">
						<option value="moscow">Москва</option>
						<option value="spb">Санкт-Петербург</option>
						<option value="kazan">Казань</option>
					</select>
					<select id="year" name="year" class="main__header__date_chooser__input main__header__date_chooser__year">
						<option value="moscow">2025</option>
						<option value="spb">2026</option>
						<option value="kazan">2027</option>
					</select>
					<div class="main__header__date_chooser__btn" data-i18n="datechoose"></div>
				</div>
				<div class="main__header__date_info">
					<span class="main__header__date_info__span" data-i18n="datetext"></span>
					<span class="main__header__date_info__span">April</span>
					<span class="main__header__date_info__span">2026</span>
				</div>
			</div>
		</main>
	</div>
	<script type="module" src="./js/main.js"></script>
</body>

</html>
